<!DOCTYPE html>
<html>
  <head>
    <script>
      let w=12, h=12;
      let f=20;
    </script>
    <style>
      * {
        font-family: monospace;
      }
      table {
        border-collapse: collapse;
      }
      td {
        padding: 0.5em;
        min-width: 1em;
        min-height: 1em;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <script>
      if (location.search) {
        let p = new URLSearchParams(location.search);
        if (p.has('w')) w = parseInt(p.get('w'));
        if (p.has('h')) h = parseInt(p.get('h'));
        if (p.has('f')) f = parseInt(p.get('f'));
      }
      if (f) {
        document.styleSheets[0].insertRule(`* { font-size: ${f}px}`);
      }
      let t = document.createElement('table');
      document.body.append(t);
      let b = document.createElement('tbody');
      t.append(b);
      for (let y = 0; y < h; y++) {
        let r = document.createElement('tr');
        for (let x = 0; x < w; x++) {
          let c = document.createElement('td');
          c.contentEditable = true;
          r.append(c);
        }
        b.append(r);
      }
      
      let ar = document.createElement('button');
      ar.innerText = '+ row';
      ar.addEventListener('click', () => {
        let r = document.createElement('tr');
        for (let x = 0; x < w; x++) {
          let c = document.createElement('td');
          c.contentEditable = true;
          r.append(c);
        }
        b.append(r);
        h++;
      });
      document.body.append(ar);

      let ac = document.createElement('button');
      ac.innerText = '+ col';
      ac.addEventListener('click', () => {
        Array.from(b.children).forEach(r => {
          let c = document.createElement('td');
          c.contentEditable = true;
          r.append(c);
        });
        w++;
      });
      document.body.append(ac);

      let rr = document.createElement('button');
      rr.innerText = '- row';
      rr.addEventListener('click', () => {
        b.lastChild.remove();
        h--;
      });
      document.body.append(rr);

      let rc = document.createElement('button');
      rc.innerText = '- col';
      rc.addEventListener('click', () => {
        Array.from(b.children).forEach(r => r.lastChild.remove());
        w--;
      });
      document.body.append(rc);
    </script>
  </body>
</html>
